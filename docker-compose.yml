version: '3.9'

services:
  # ===== MongoDB Service =====
  mongo:
    image: mongo:6.0
    container_name: bookstore-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD:  ${MONGO_PASSWORD:-mongodb_password_123}
      MONGO_INITDB_DATABASE: bookstoredb
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - bookstore-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Backend (из Docker Hub) =====
  backend:
    image: gunner2005/bookstore-backend:latest
    container_name: bookstore-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:${MONGO_PASSWORD}@mongo:27017/bookstoredb?authSource=admin
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - bookstore-network

  # ===== Frontend (из Docker Hub) =====
  frontend:
    image: gunner2005/bookstore-frontend:latest
    container_name: bookstore-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - bookstore-network

volumes:
  mongodb_data:
  mongodb_config:

networks:
  bookstore-network:
    driver: bridge