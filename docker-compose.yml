version: '3.9'

services:
  # MongoDB
  mongo:
    image:  mongo:6.0
    container_name: bookstore-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongodb_password_123
      MONGO_INITDB_DATABASE: bookstoredb
    volumes:
      - mongodb_data:/data/db
    networks:
      - bookstore-network
    healthcheck:
      test:  echo 'db. runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build: ./backend
    container_name: bookstore-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:mongodb_password_123@mongo:27017/bookstoredb?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-in-production}
      JWT_EXPIRATION_MS: 86400000
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - bookstore-network
    healthcheck:
      test: curl -f http://localhost:8080/api/auth/verify || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    build: ./frontend
    container_name: bookstore-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - bookstore-network

volumes:
  mongodb_data:
    driver: local

networks:
  bookstore-network:
    driver: bridge