spring:
  application:
    name: bookstore-backend

  # ===== MongoDB Configuration (для Docker) =====
  data:
    mongodb:
      # ✅ Для Docker - используем имя сервиса
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongo:27017/bookstoredb}
      auto-index-creation: true

  # ===== Session Configuration =====
  session:
    store-type: mongodb
    mongodb:
      collection-name: spring_session
    timeout: 1800

  servlet:
    session:
      timeout: 30m
      cookie:
        name:  JSESSIONID
        http-only: true
        secure: true  # true в Docker/production
        same-site: strict

  # ===== Jackson Configuration =====
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true

# ===== Server Configuration =====
server:
  port: ${SERVER_PORT:8080}

# ===== Logging =====
logging:
  level:
    root:  WARN
    com.example.bookstore: INFO
    org.springframework.session: INFO