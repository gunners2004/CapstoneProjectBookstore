sspring:
  application:
    name: bookstore-backend

  # ===== MongoDB Configuration =====
  data:
    mongodb:
      # ✅ Для локального развития
      uri: mongodb://localhost:27017/bookstoredb
      auto-index-creation: true

  # ===== Session Configuration =====
  session:
    store-type: mongodb
    mongodb:
      collection-name: spring_session
    timeout: 1800 # 30 минут

  servlet:
    session:
      timeout: 30m
      cookie:
        name:  JSESSIONID
        http-only: true
        secure:  false  # false для локального, true в production
        same-site: lax

  # ===== Jackson Configuration =====
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    default-property-inclusion: non_null

# ===== Server Configuration =====
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always

# ===== Logging =====
logging:
  level:
    root: INFO
    com.example. bookstore: DEBUG
    org.springframework.data.mongodb:  INFO
    org.springframework.session: INFO